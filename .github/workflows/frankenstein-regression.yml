name: Frankenstein Village regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  clean-checkout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run clean-checkout suite
        run: python spike/tests/run_all.py
